<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="Privex: Agentic visual firewall + memory">
<defs>
  <radialGradient id="g2" cx="1" cy="0" r="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".22"/><stop offset=".6" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <linearGradient id="sg2" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <clipPath id="cg2"><rect width="580" height="300" rx="18"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .t{font-size:30px;font-weight:800;fill:#e8eef6;letter-spacing:-.6px}
  .k{font-family:'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;font-size:12.5px;fill:#a78bfa;letter-spacing:1.2px}
  .b{font-size:15px;fill:#8a97ab}
  .c,.st{font-family:'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;font-size:12px;fill:#b9c6d8}
  .st{font-size:11px;font-weight:700;letter-spacing:1px;fill:#22d3ee}
  .mv{font-size:22px;font-weight:800;fill:#a78bfa}
  .ml{font-family:'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;font-size:12.5px;fill:#8a97ab}
  .scan{animation:scan 5s ease-in-out infinite;animation-delay:1.2s}
  @keyframes scan{0%{transform:translateX(-580px)}60%,100%{transform:translateX(580px)}}
  .dot{animation:d 1.8s ease-in-out infinite} @keyframes d{50%{opacity:.25}}
</style>
<g clip-path="url(#cg2)">
  <rect width="580" height="300" fill="#0f1521"/>
  <rect width="580" height="300" fill="url(#g2)"/>
  <rect class="scan" x="0" y="0" width="580" height="2" fill="url(#sg2)"/>
  <rect x="0" y="0" width="5" height="300" fill="#a78bfa" opacity=".85"/>
</g>
<rect x=".5" y=".5" width="579" height="299" rx="18" fill="none" stroke="#1e2a3d"/>
<text x="28" y="46" class="k">AGENTIC VISUAL FIREWALL + MEMORY</text>
<g transform="translate(479,28)"><rect width="77" height="24" rx="12" fill="none" stroke="#22d3ee" stroke-opacity=".5"/>
<circle class="dot" cx="13" cy="12" r="3.5" fill="#22d3ee"/><text x="22" y="16" class="st">SHIPPED</text></g>
<text x="28" y="88" class="t">Privex</text>
<text x="28" y="122" class="b">Redacts credentials from live meetings with YOLOv8 + OCR, and</text><text x="28" y="144" class="b">remembers context through a vector + Neo4j graph memory</text><text x="28" y="166" class="b">orchestrated by LangGraph.</text>
<text x="28" y="228" class="mv">Vector + Graph</text>
<text x="211" y="228" class="ml">multi-hop hybrid memory</text>
<g transform="translate(28,250)"><rect width="88" height="26" rx="7" fill="#162033" stroke="#1e2a3d"/><text x="11" y="17.5" class="c">LangGraph</text></g><g transform="translate(124,250)"><rect width="66" height="26" rx="7" fill="#162033" stroke="#1e2a3d"/><text x="11" y="17.5" class="c">YOLOv8</text></g><g transform="translate(198,250)"><rect width="59" height="26" rx="7" fill="#162033" stroke="#1e2a3d"/><text x="11" y="17.5" class="c">Neo4j</text></g><g transform="translate(264,250)"><rect width="44" height="26" rx="7" fill="#162033" stroke="#1e2a3d"/><text x="11" y="17.5" class="c">MCP</text></g>
</svg>
