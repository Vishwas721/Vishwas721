<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="NagarikOne: Geospatial civic reporting">
<defs>
  <radialGradient id="g7" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".22"/><stop offset=".6" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <linearGradient id="sg7" x1="0" x2="1"><stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
  <clipPath id="cg7"><rect width="580" height="300" rx="18"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .t{font-size:30px;font-weight:800;fill:#e8eef6;letter-spacing:-.6px}
  .k{font-family:'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;font-size:12.5px;fill:#f472b6;letter-spacing:1.2px}
  .b{font-size:15px;fill:#8a97ab}
  .c,.st{font-family:'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;font-size:12px;fill:#b9c6d8}
  .st{font-size:11px;font-weight:700;letter-spacing:1px;fill:#22d3ee}
  .mv{font-size:22px;font-weight:800;fill:#f472b6}
  .ml{font-family:'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;font-size:12.5px;fill:#8a97ab}
  .scan{animation:scan 5s ease-in-out infinite;animation-delay:4.2s}
  @keyframes scan{0%{transform:translateX(-580px)}60%,100%{transform:translateX(580px)}}
  .dot{animation:d 1.8s ease-in-out infinite} @keyframes d{50%{opacity:.25}}
</style>
<g clip-path="url(#cg7)">
  <rect width="580" height="300" fill="#0f1521"/>
  <rect width="580" height="300" fill="url(#g7)"/>
  <rect class="scan" x="0" y="0" width="580" height="2" fill="url(#sg7)"/>
  <rect x="0" y="0" width="5" height="300" fill="#f472b6" opacity=".85"/>
</g>
<rect x=".5" y=".5" width="579" height="299" rx="18" fill="none" stroke="#1e2a3d"/>
<text x="28" y="46" class="k">GEOSPATIAL CIVIC REPORTING</text>
<g transform="translate(479,28)"><rect width="77" height="24" rx="12" fill="none" stroke="#22d3ee" stroke-opacity=".5"/>
<circle class="dot" cx="13" cy="12" r="3.5" fill="#22d3ee"/><text x="22" y="16" class="st">PILOTED</text></g>
<text x="28" y="88" class="t">NagarikOne</text>
<text x="28" y="122" class="b">Citizens report civic issues; PostGIS auto-merges duplicates</text><text x="28" y="144" class="b">within a 50 m radius. Validated on a live pilot across</text><text x="28" y="166" class="b">Bengaluru.</text>
<text x="28" y="228" class="mv">50 m · &lt;5 s</text>
<text x="173" y="228" class="ml">geo-dedupe latency</text>
<g transform="translate(28,250)"><rect width="110" height="26" rx="7" fill="#162033" stroke="#1e2a3d"/><text x="11" y="17.5" class="c">React Native</text></g><g transform="translate(146,250)"><rect width="73" height="26" rx="7" fill="#162033" stroke="#1e2a3d"/><text x="11" y="17.5" class="c">PostGIS</text></g><g transform="translate(227,250)"><rect width="73" height="26" rx="7" fill="#162033" stroke="#1e2a3d"/><text x="11" y="17.5" class="c">Node.js</text></g><g transform="translate(308,250)"><rect width="66" height="26" rx="7" fill="#162033" stroke="#1e2a3d"/><text x="11" y="17.5" class="c">Vercel</text></g>
</svg>
