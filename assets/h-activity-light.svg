<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 78" width="1200" height="78" role="img" aria-label="activity">
<defs><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#0891b2"/><stop offset=".35" stop-color="#7c3aed"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient></defs>
<style>@font-face{font-family:'D';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'M';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'M';font-weight:700;src:url(data:font/woff;base64,) format('woff')}
  .i{font-family:'M',Consolas, 'SFMono-Regular', Menlo, monospace;font-weight:700;font-size:14px;fill:#0891b2}
  .t{font-family:'D','Segoe UI', Helvetica, Arial, sans-serif;font-weight:700;font-size:30px;fill:#0f172a;letter-spacing:-.5px}
  .s{font-family:'M',Consolas, 'SFMono-Regular', Menlo, monospace;font-weight:400;font-size:13px;fill:#526077}
  .ln{transform-origin:0 0;transform:scaleX(0);animation:g 1.2s .2s cubic-bezier(.2,.7,.2,1) forwards} @keyframes g{to{transform:scaleX(1)}}
  .dot{animation:mv 3.5s ease-in-out infinite 1.4s;opacity:0} @keyframes mv{0%{opacity:0;transform:translateX(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(1140px)}}
</style>
<rect x="2" y="16" width="34" height="26" rx="7" fill="#0891b2" fill-opacity=".12" stroke="#0891b2" stroke-opacity=".4"/>
<text x="19" y="34" class="i" text-anchor="middle">04</text>
<text x="50" y="41" class="t">activity</text>
<text x="1198" y="38" class="s" text-anchor="end">refreshed daily by GitHub Actions</text>
<rect class="ln" x="2" y="64" width="1196" height="2" rx="1" fill="url(#hl)"/>
<circle class="dot" cx="6" cy="65" r="3.5" fill="#0891b2"/>
</svg>
