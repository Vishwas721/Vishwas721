<style>@font-face{font-family:'D';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'M';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'M';font-weight:700;src:url(data:font/woff;base64,) format('woff')}
  .i{font-family:'M',Consolas, 'SFMono-Regular', Menlo, monospace;font-weight:700;font-size:14px;fill:#22d3ee}
