n="2.25s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="2.4s" begin="2.70s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p6"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="2.70s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#34d399" filter="url(#glow)"><animateMotion dur="3.0s" begin="3.15s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p7"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.0s" begin="3.15s" repeatCount="indefinite"/></circle><circle r="3.2" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="3.5999999999999996s" begin="3.60s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p8"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.5999999999999996s" begin="3.60s" repeatCount="indefinite"/></circle><g transform="translate(760,110)"><circle r="20" fill="#22d3ee" opacity=".12" class="pulse" style="animation-delay:0.0s"/><circle r="9" fill="#0f1521" stroke="#22d3ee" stroke-width="2"/><circle r="3.5" fill="#22d3ee"/><text y="34" text-anchor="middle" class="node">ingest</text></g><g transform="translate(900,70)"><circle r="20" fill="#a78bfa" opacity=".12" class="pulse" style="animation-delay:0.4s"/><circle r="9" fill="#0f1521" stroke="#a78bfa" stroke-width="2"/><circle r="3.5" fill="#a78bfa"/><text y="34" text-anchor="middle" class="node">embed</text></g><g transform="translate(900,175)"><circle r="20" fill="#34d399" opacity=".12" class="pulse" style="animation-delay:0.8s"/><circle r="9" fill="#0f1521" stroke="#34d399" stroke-width="2"/><circle r="3.5" fill="#34d399"/><text y="34" text-anchor="middle" class="node">graph</text></g><g transform="translate(1040,125)"><circle r="20" fill="#f472b6" opacity=".12" class="pulse" style="animation-delay:1.2s"/><circle r="9" fill="#0f1521" stroke="#f472b6" stroke-width="2"/><circle r="3.5" fill="#f472b6"/><text y="34" text-anchor="middle" class="node">agent</text></g><g transform="translate(1050,260)"><circle r="20" fill="#22d3ee" opacity=".12" class="pulse" style="animation-delay:1.6s"/><circle r="9" fill="#0f1521" stroke="#22d3ee" stroke-width="2"/><circle r="3.5" fill="#22d3ee"/><text y="34" text-anchor="middle" class="node">tools</text></g><g transform="translate(900,290)"><circle r="20" fill="#a78bfa" opacity=".12" class="pulse" style="animation-delay:2.0s"/><circle r="9" fill="#0f1521" stroke="#a78bfa" stroke-width="2"/><circle r="3.5" fill="#a78bfa"/><text y="34" text-anchor="middle" class="node">api</text></g><g transform="translate(760,245)"><circle r="20" fill="#34d399" opacity=".12" class="pulse" style="animation-delay:2.4s"/><circle r="9" fill="#0f1521" stroke="#34d399" stroke-width="2"/><circle r="3.5" fill="#34d399"/><text y="34" text-anchor="middle" class="node">ui</text></g></g>
