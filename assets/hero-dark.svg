<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Vishwas K — AI and full-stack systems engineer">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#16202f"/></pattern>
  <linearGradient id="name" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="orb1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" x2="1"><stop offset=".45" stop-color="#0a0e16" stop-opacity="1"/><stop offset=".62" stop-color="#0a0e16" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .mono,.node,.chip,.prompt{font-family:'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace}
  .node{font-size:11px;fill:#8a97ab;letter-spacing:.5px}
  .chip{font-size:13px;fill:#b9c6d8}
  .prompt{font-size:15px;fill:#8a97ab}
  .name{font-size:84px;font-weight:800;letter-spacing:-2.5px;fill:url(#name)}
  .role{font-size:24px;font-weight:600;fill:#e8eef6}
  .lead{font-size:19px;fill:#8a97ab}
  .rot{font-size:19px;font-weight:600;fill:#22d3ee;opacity:0;animation:rot 12.8s infinite}
  @keyframes rot{0%{opacity:0;transform:translateY(10px)}3.0%{opacity:1;transform:translateY(0)}21.5%{opacity:1;transform:translateY(0)}25.0%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
  .flow{stroke-dasharray:6 14;animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-40}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(.7);opacity:.05}50%{transform:scale(1.25);opacity:.22}}
  .cursor{animation:blink 1s steps(1) infinite} .blink{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:0}}
  .orb{animation:drift 14s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(-60px,30px)}}
  .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="400" fill="#0a0e16"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <circle class="orb" cx="980" cy="120" r="300" fill="url(#orb1)"/>
  <circle class="orb" style="animation-delay:-7s" cx="260" cy="380" r="280" fill="url(#orb2)"/>
  <g><path id="p0" d="M760,110 L900,70" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M760,110 L900,70" stroke="#22d3ee" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-0.00s" opacity=".55"/><path id="p1" d="M760,110 L900,175" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M760,110 L900,175" stroke="#a78bfa" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-0.37s" opacity=".55"/><path id="p2" d="M900,70 L1040,125" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M900,70 L1040,125" stroke="#34d399" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-0.74s" opacity=".55"/><path id="p3" d="M900,175 L1040,125" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M900,175 L1040,125" stroke="#22d3ee" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-1.11s" opacity=".55"/><path id="p4" d="M1040,125 L1050,260" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M1040,125 L1050,260" stroke="#a78bfa" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-1.48s" opacity=".55"/><path id="p5" d="M1050,260 L900,290" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M1050,260 L900,290" stroke="#f472b6" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-1.85s" opacity=".55"/><path id="p6" d="M1040,125 L900,290" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M1040,125 L900,290" stroke="#22d3ee" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-2.22s" opacity=".55"/><path id="p7" d="M900,290 L760,245" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M900,290 L760,245" stroke="#34d399" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-2.59s" opacity=".55"/><path id="p8" d="M760,245 L760,110" stroke="#1e2a3d" stroke-width="1.5" fill="none"/><path d="M760,245 L760,110" stroke="#a78bfa" stroke-width="1.5" fill="none" class="flow" style="animation-delay:-2.96s" opacity=".55"/><circle